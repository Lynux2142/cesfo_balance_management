<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CESFO - Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container" style="max-width: 400px; margin-top: 60px;">
        <h1>CESFO Login</h1>
        {% if error %}
            <div style="background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px;">{{ error }}</div>
        {% endif %}
        <form action="/login" method="POST">
            <div style="margin-bottom: 15px;">
                <label style="display:block; font-weight:500; margin-bottom:5px;">First Name</label>
                <input type="text" name="first_name" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
            </div>
            <div style="margin-bottom: 20px;">
                <label style="display:block; font-weight:500; margin-bottom:5px;">Last Name</label>
                <input type="text" name="last_name" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box;">
            </div>
            <button type="submit" style="width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; margin-bottom: 10px;">Connect</button>
        </form>
        <a href="/register" style="display: block; text-align: center; color: #2563eb; text-decoration: none; font-size: 14px; margin-top: 10px;">Create an account</a>
    </div>
</body>
</html>
